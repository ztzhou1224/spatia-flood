# Internal flood-layer viewer (owner + demos; plan docs/04 decision 16). Deploy: see viewer/README.md.
name = "spatia-flood-viewer"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false  # reachable only at the custom domain, never at *.workers.dev

# flood.runspatia.com is attached as a Workers custom domain through the account API (2026-10-08), not here:
# the deploy token has no zone Workers-routes permission. See README.md.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true  # every request, the page included, passes the login check in the Worker

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "spatia-data"  # private; the Worker reads only _flood/viewer/ (see src/worker.js)

[vars]
FIPS = "12103"
RELEASE = "pinellas-r1"
VIEWER_USER = "flood"
# VIEWER_PASSWORD is a secret: `wrangler secret put VIEWER_PASSWORD` (never in this file)
