[project]
name = "spatia-flood"
version = "0.1.0"
description = "Per-building first-floor height / elevation vs FEMA BFE (flood layer v1)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43",
    "duckdb>=1.5",
    "geopandas>=1.2",
    "h3>=4.5",
    "lightgbm>=4.7",
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=25",
    "pyproj>=3.8",
    "requests>=2.34",
    "scikit-learn>=1.9",
    "shapely>=2.2",
    "tabulate>=0.10",
]

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8.4", "ruff>=0.16"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["pipeline/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# E402: the pipeline scripts put their sibling directory on sys.path before importing it
# RUF001-003: prose and docstrings use typographic characters (−, ±, ²) on purpose
ignore = ["E402", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["pipeline"]
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
